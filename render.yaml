services:
  - type: web
    name: notification-history-api
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 30

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.13

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: MONGO_URI
        sync: false

      - key: DB_NAME
        value: notification_history

      - key: WEBHOOK_URL
        sync: false

      - key: WEBHOOK_SECRET
        generateValue: true
